  <title>Balaton Polar Router</title>

    * { box-sizing: border-box; margin: 0; padding: 0; }

    .header { background: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
    .header h1 { font-size: 1.05rem; font-weight: 600; }
    .container { padding: 12px; max-width: 980px; margin: 0 auto; padding-bottom: 60px; }
    .card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    label { display: block; font-size: 0.78rem; color: #94a3b8; margin-bottom: 4px; }
    select, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 0.95rem; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-success { background: #10b981; color: white; }
    .btn-warning { background: #f59e0b; color: #000; }
    #map { height: 480px; border-radius: 12px; margin-top: 8px; }
    .result { background: #0f766e; border-radius: 8px; padding: 12px; margin-top: 10px; font-size: 0.9rem; }
    .status { font-size: 0.78rem; color: #64748b; margin-top: 4px; }
    .wind-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 10px; }
    .wind-table th { background: #1e40af; color: white; padding: 8px 6px; text-align: left; }
    .wind-table td { padding: 7px 6px; border-bottom: 1px solid #334155; }
    .wind-table tr:nth-child(even) { background: #0f172a; }
  </style>
</head>

  <div class="header">
    <div>
      <a href="/" style="color:#94a3b8;font-size:0.75rem;text-decoration:none;">← nbsailing.hu</a>
      <h1>Balaton Polar Router</h1>
    </div>
    <span id="clock" style="font-size:0.8rem;color:#94a3b8;"></span>

  <div class="container">
    <div class="card">
      <label>Hajó</label>
      <select id="boat">

      </select>
    </div>
    <div class="card">
      <label>Széladatok (met.hu)</label>
      <button class="btn-success" onclick="loadWindFromWorker()">Friss szél lekérése</button>

      </div>
    </div>
    <div class="card">

            <option value="keszthely">Keszthely</option>

        </div>
      </div>
    </div>

    <div class="card">

      { lat: 46.901, lon: 17.912, name: "Szoros ÉK" },
      { lat: 46.897, lon: 17.906, name: "Kardinálisok" },
      { lat: 46.894, lon: 17.902, name: "Cső ÉK" },
      { lat: 46.891, lon: 17.898, name: "Tihanyrév" },
      { lat: 46.888, lon: 17.890, name: "Cső" },
      { lat: 46.888, lon: 17.884, name: "Szoros NY" }
    ];

    let map, boatMarker, targetMarker, routeLine, lakePolyLayer, channelLine, landPolyLayer, shallowLayer;
    let currentPos = null;
    let allStations = {};

    setInterval(() => {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString('hu-HU');
    }, 1000);

    function initMap() {
      map = L.map('map').setView([46.91, 17.87], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap', maxZoom: 18
      }).addTo(map);
      L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
        attribution: '© OpenSeaMap', maxZoom: 18
      }).addTo(map);
      lakePolyLayer = L.polygon(balatonPolygon, {
        color: '#38bdf8', weight: 1.5, fillColor: '#0ea5e9', fillOpacity: 0.08
      }).addTo(map);
      landPolyLayer = L.polygon(tihanyLand, {
        color: '#f87171', weight: 1, fillColor: '#ef4444', fillOpacity: 0.12
      }).addTo(map);
      shallowLayer = L.polygon(tihanyShallow, {
        color: '#ef4444', weight: 1.5, dashArray: '4 4', fillColor: '#dc2626', fillOpacity: 0.22
      }).addTo(map).bindPopup('Tiltott: sekély (Zamárdi–Szántód)');
      channelLine = L.polyline(TIHANY_CHANNEL.map(p => [p.lat, p.lon]), {
        color: '#22c55e', weight: 4, opacity: 0.95
      }).addTo(map).bindPopup('Tihanyi hajóút (cső)');
    }

    function pointInPolygon(lat, lon, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const yi = poly[i][0], xi = poly[i][1];
        const yj = poly[j][0], xj = poly[j][1];
        const intersect = ((yi > lat) !== (yj > lat)) &&
          (lon < (xj - xi) * (lat - yi) / ((yj - yi) || 1e-12) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function onWater(lat, lon) {
      if (pointInPolygon(lat, lon, tihanyLand)) return false;
      if (pointInPolygon(lat, lon, tihanyShallow)) return false;
      return pointInPolygon(lat, lon, balatonPolygon);
    }

    function segmentOnWater(a, b, samples) {
      const n = samples || 10;
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        const lat = a.lat + (b.lat - a.lat) * t;
        const lon = a.lon + (b.lon - a.lon) * t;
        if (!onWater(lat, lon)) return false;
      }
      return true;
    }

    function inStraitZone(lat, lon) {
      return lon > 17.882 && lon < 17.915 && lat > 46.885 && lat < 46.905;
    }

    function needsTihanyCrossing(from, to) {
      const aEast = from.lon >= 17.90;
      const bEast = to.lon >= 17.90;
      const aWest = from.lon <= 17.86;
      const bWest = to.lon <= 17.86;
      return (aEast && bWest) || (aWest && bEast);
    }

    async function loadWindFromWorker() {
      const status = document.getElementById('windStatus');
      const tbody = document.getElementById('windBody');
      status.textContent = "Lekérés...";
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Betöltés...</td></tr>';
      try {
        const res = await fetch(WORKER_URL + "?t=" + Date.now());
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Hiba");
        allStations = data.stations || {};
        const list = Object.values(allStations);
        tbody.innerHTML = list.map(s => {
          const gustDir = s.gust_directionText || s.directionText || "-";
          const gustDeg = (s.gust_direction != null) ? s.gust_direction : s.direction;
          return `<tr>
            <td><strong>${s.name}</strong></td>
            <td>${gustDir} (${gustDeg}°)</td>
            <td>${s.gust_kmh}</td>
            <td>${s.directionText || '-'} (${s.direction}°)</td>
            <td>${s.avg_kmh}</td>
            <td><strong>${s.avg_kt}</strong></td>
          </tr>`;
        }).join("");
        status.textContent = `Frissítve: ${new Date().toLocaleTimeString('hu-HU')} • ${list.length} állomás`;
      } catch (e) {
        status.textContent = "Hiba: " + e.message;
        tbody.innerHTML = `<tr><td colspan="6" style="color:#f87171;">${e.message}</td></tr>`;
      }
    }

    function getLocation() {
      const status = document.getElementById('locStatus');
      status.textContent = "Keresés...";
      navigator.geolocation.getCurrentPosition(pos => {
        currentPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        updatePositionMarker();
        status.textContent = `${currentPos.lat.toFixed(5)}, ${currentPos.lon.toFixed(5)}`;
      }, err => status.textContent = "Hiba: " + err.message, { enableHighAccuracy: true });
    }

    function setTestPosition() {
      currentPos = { lat: 46.93878, lon: 17.91093 };
      updatePositionMarker();
      document.getElementById('locStatus').textContent = "Teszt: 46.93878, 17.91093";
    }

    function updatePositionMarker() {
      if (boatMarker) map.removeLayer(boatMarker);
      boatMarker = L.circleMarker([currentPos.lat, currentPos.lon], {
        radius: 9, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.95
      }).addTo(map).bindPopup("Pozíció");
      map.setView([currentPos.lat, currentPos.lon], 12);
    }

    function getInterpolatedWind(lat, lon) {
      let sumW = 0, sumDirX = 0, sumDirY = 0, sumSpd = 0;
      for (const [name, st] of Object.entries(allStations)) {
        const coord = stationCoords[name];
        if (!coord) continue;
        const d = haversineKm(lat, lon, coord.lat, coord.lon);
        if (d < 0.15) return { dir: st.direction, spd: st.avg_kt };
        const w = 1 / Math.pow(d, 2);
        const rad = st.direction * Math.PI / 180;
        sumDirX += Math.cos(rad) * w;
        sumDirY += Math.sin(rad) * w;
        sumSpd += st.avg_kt * w;
        sumW += w;
      }
      if (sumW === 0) return { dir: 225, spd: 6 };
      const dir = (Math.atan2(sumDirY / sumW, sumDirX / sumW) * 180 / Math.PI + 360) % 360;
      return { dir, spd: sumSpd / sumW };
    }

    function getBoatSpeed(polar, windKt, twa) {
      const winds = polar.winds;
      let w1 = winds[0], w2 = winds[winds.length-1];
      for (let i = 0; i < winds.length-1; i++) {
        if (windKt >= winds[i] && windKt <= winds[i+1]) { w1 = winds[i]; w2 = winds[i+1]; break; }
      }
      if (windKt <= winds[0]) w1 = w2 = winds[0];
      if (windKt >= winds[winds.length-1]) w1 = w2 = winds[winds.length-1];
      const idx1 = winds.indexOf(w1);
      if (twa <= polar.beatAngles[idx1] + 3) {
        const ratio = (w2 === w1) ? 0 : (windKt - w1)/(w2 - w1);
        const vmg = polar.beatVMG[idx1] + ratio * (polar.beatVMG[winds.indexOf(w2)] - polar.beatVMG[idx1]);
        return { speed: vmg / Math.cos(Math.min(twa, 80)*Math.PI/180), vmg };
      }
      const angles = polar.angles;
      let a1 = angles[0], a2 = angles[angles.length-1];
      for (let i = 0; i < angles.length-1; i++) {
        if (twa >= angles[i] && twa <= angles[i+1]) { a1 = angles[i]; a2 = angles[i+1]; break; }
      }
      function sp(w, a) { return polar.speeds[w][angles.indexOf(a)]; }
      const rW = (w2 === w1) ? 0 : (windKt - w1)/(w2 - w1);
      const rA = (a2 === a1) ? 0 : (twa - a1)/(a2 - a1);
      const s = (sp(w1,a1) + rA*(sp(w1,a2)-sp(w1,a1))) + rW*((sp(w2,a1)+rA*(sp(w2,a2)-sp(w2,a1)))-(sp(w1,a1)+rA*(sp(w1,a2)-sp(w1,a1))));
      return { speed: s, vmg: s * Math.cos(twa * Math.PI/180) };
    }

    function stepToward(pos, goal, stepKm) {
      const h = calcBearing(pos.lat, pos.lon, goal.lat, goal.lon);
      const offsets = [0, 8, -8, 16, -16, 24, -24, 32, -32, 45, -45, 60, -60];
      for (const off of offsets) {
        const heading = (h + off + 360) % 360;
        const next = destinationPoint(pos.lat, pos.lon, heading, stepKm);
        if (segmentOnWater(pos, next, 8)) return { next, heading, stepKm };
      }
      const smaller = destinationPoint(pos.lat, pos.lon, h, stepKm * 0.4);
      if (segmentOnWater(pos, smaller, 8)) return { next: smaller, heading: h, stepKm: stepKm * 0.4 };
      return null;
    }

    function followWaypoints(start, waypoints) {
      const path = [[start.lat, start.lon]];
      let pos = { ...start };
      let totalNM = 0;
      for (const wp of waypoints) {
        let guard = 0;
        while (haversineKm(pos.lat, pos.lon, wp.lat, wp.lon) > 0.09 && guard++ < 80) {
          const strait = inStraitZone(pos.lat, pos.lon) || inStraitZone(wp.lat, wp.lon);
          const stepKm = strait ? 0.10 : 0.45;
          const moved = stepToward(pos, wp, stepKm);
          if (!moved) break;
          pos = moved.next;
          path.push([pos.lat, pos.lon]);
          totalNM += moved.stepKm / 1.852;
        }
        if (onWater(wp.lat, wp.lon) && haversineKm(pos.lat, pos.lon, wp.lat, wp.lon) < 0.25) {
          pos = { lat: wp.lat, lon: wp.lon };
          path.push([pos.lat, pos.lon]);
        }
      }
      return { path, pos, totalNM };
    }

    function polarRoute(start, goal, polar) {
      const path = [[start.lat, start.lon]];
      let pos = { ...start };
      let totalNM = 0, totalTime = 0;
      for (let i = 0; i < 100; i++) {
        const distNM = haversineNM(pos.lat, pos.lon, goal.lat, goal.lon);
        if (distNM < 0.4) break;
        const strait = inStraitZone(pos.lat, pos.lon);
        const stepNM = strait ? 0.054 : 0.40;
        const wind = getInterpolatedWind(pos.lat, pos.lon);
        const bearing = calcBearing(pos.lat, pos.lon, goal.lat, goal.lon);
        let best = null;
        function consider(heading, speed, scale) {
          const testPos = destinationPoint(pos.lat, pos.lon, heading, stepNM * 1.852 * scale);
          if (!segmentOnWater(pos, testPos, 10)) return;
          let vmg = speed * Math.cos(angleDiff(heading, bearing) * Math.PI / 180);
          if (pos.lon < 17.60 && (heading > 300 || heading < 40)) vmg -= 0.18;
          if (!best || vmg > best.vmg) best = { heading, vmg, speed, next: testPos, stepNM: stepNM * scale };
        }
        if (strait) {
          consider(bearing, 3, 1);
        } else {
          for (let twa = 35; twa <= 165; twa += 3) {
            const res = getBoatSpeed(polar, wind.spd, twa);
            consider((wind.dir + twa) % 360, res.speed, 1);
            consider((wind.dir - twa + 360) % 360, res.speed, 1);
          }
        }
        if (!best) {
          const moved = stepToward(pos, goal, stepNM * 1.852);
          if (!moved) break;
          best = { next: moved.next, speed: 2.5, stepNM: moved.stepKm / 1.852 };
        }
        path.push([best.next.lat, best.next.lon]);
        totalNM += best.stepNM;
        totalTime += best.stepNM / Math.max(best.speed, 0.5);
        pos = best.next;
      }
      if (onWater(goal.lat, goal.lon) && segmentOnWater(pos, goal, 12)) {
        path.push([goal.lat, goal.lon]);
      }
      return { path, pos, totalNM, totalTime };
    }

    function planFullRoute() {
      if (!currentPos) { alert("Előbb állíts be pozíciót!"); return; }
      if (Object.keys(allStations).length === 0) {
        alert("Előbb töltsd le a széladatokat a zöld gombbal!");
        return;
      }
      const polar = polars[document.getElementById('boat').value];
      const target = presets[document.getElementById('targetSelect').value];
      if (routeLine) map.removeLayer(routeLine);
      if (targetMarker) map.removeLayer(targetMarker);

      let path = [[currentPos.lat, currentPos.lon]];
      let pos = { ...currentPos };
      let totalNM = 0, totalTime = 0;

      if (needsTihanyCrossing(currentPos, target)) {
        const goingWest = currentPos.lon > target.lon;
        const channel = goingWest ? TIHANY_CHANNEL : TIHANY_CHANNEL.slice().reverse();
        const gate = channel[0];
        const approach = polarRoute(pos, gate, polar);
        path = path.concat(approach.path.slice(1));
        totalNM += approach.totalNM;
        totalTime += approach.totalTime;
        pos = approach.pos;
        const corridor = followWaypoints(pos, channel);
        path = path.concat(corridor.path.slice(1));
        totalNM += corridor.totalNM;
        pos = corridor.pos;
      }

      const rest = polarRoute(pos, target, polar);
      path = path.concat(rest.path.slice(1));
      totalNM += rest.totalNM;
      totalTime += rest.totalTime || (rest.totalNM / 5);

      routeLine = L.polyline(path, { color: '#3b82f6', weight: 5, opacity: 0.92 }).addTo(map);
      targetMarker = L.marker([target.lat, target.lon]).addTo(map)
        .bindPopup(`<b>${target.name}</b>`).openPopup();
      map.fitBounds(path, { padding: [40, 40] });

      const h = Math.floor(totalTime);
      const m = Math.round((totalTime - h) * 60);
      document.getElementById('result').style.display = 'block';
      document.getElementById('result').innerHTML = `
        <strong>${target.name}</strong><br>
        Távolság: ~${totalNM.toFixed(1)} NM<br>
        Becsült idő: ${h} óra ${m} perc<br>
        <span style="font-size:0.8rem;opacity:0.85;">Zöld: kényszerített cső. Piros satír: sekély, tilos.</span>
      `;
    }

    function haversineNM(lat1, lon1, lat2, lon2) {
      return haversineKm(lat1, lon1, lat2, lon2) / 1.852;
    }
    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function calcBearing(lat1, lon1, lat2, lon2) {
      const φ1 = lat1*Math.PI/180, φ2 = lat2*Math.PI/180, Δλ = (lon2-lon1)*Math.PI/180;
      const y = Math.sin(Δλ)*Math.cos(φ2);
      const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
      return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
    }
    function angleDiff(a, b) {
      let d = Math.abs(a - b) % 360;
      return d > 180 ? 360 - d : d;
    }
    function destinationPoint(lat, lon, bearing, distKm) {
      const R = 6371, δ = distKm/R, θ = bearing*Math.PI/180;
      const φ1 = lat*Math.PI/180, λ1 = lon*Math.PI/180;
      const φ2 = Math.asin(Math.sin(φ1)*Math.cos(δ) + Math.cos(φ1)*Math.sin(δ)*Math.cos(θ));
      const λ2 = λ1 + Math.atan2(Math.sin(θ)*Math.sin(δ)*Math.cos(φ1), Math.cos(δ)-Math.sin(φ1)*Math.sin(φ2));
      return { lat: φ2*180/Math.PI, lon: ((λ2*180/Math.PI)+540)%360-180 };
    }

    initMap();
  </script>
</body>
