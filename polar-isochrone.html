<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Balaton Isochrone">
  <title>Balaton Polar Isochrone</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
    .header { background: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
    .header h1 { font-size: 1.05rem; font-weight: 600; }
    .container { padding: 12px; max-width: 980px; margin: 0 auto; padding-bottom: 60px; }
    .card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    label { display: block; font-size: 0.78rem; color: #94a3b8; margin-bottom: 4px; }
    select, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 0.95rem; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-success { background: #10b981; color: white; }
    .btn-warning { background: #f59e0b; color: #000; }
    #map { height: 480px; border-radius: 12px; margin-top: 8px; }
    .result { background: #0f766e; border-radius: 8px; padding: 12px; margin-top: 10px; font-size: 0.9rem; }
    .status { font-size: 0.78rem; color: #64748b; margin-top: 4px; }
    .wind-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 10px; }
    .wind-table th { background: #1e40af; color: white; padding: 8px 6px; text-align: left; }
    .wind-table td { padding: 7px 6px; border-bottom: 1px solid #334155; }
    .chk { display: flex; align-items: center; gap: 8px; margin: 6px 0; color: #e2e8f0; font-size: 0.9rem; cursor: pointer; }
    .chk input { width: auto; accent-color: #3b82f6; }
    .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <a href="/" style="color:#94a3b8;font-size:0.75rem;text-decoration:none;">← nbsailing.hu</a>
      <h1>Balaton Polar Isochrone</h1>
    </div>
    <span id="clock" style="font-size:0.8rem;color:#94a3b8;"></span>
  </div>
  <div class="container">
    <div class="card">
      <label>Hajó</label>
      <select id="boat">
        <option value="elan310">Nautic 311 / Elan 310</option>
        <option value="aiolos">Aiolos HUN295 (ORC)</option>
      </select>
    </div>
    <div class="card">
      <label>Széladatok (met.hu)</label>
      <button class="btn-success" onclick="loadWindFromWorker()">Friss szél lekérése</button>
      <div class="status" id="windStatus">Még nem frissítve</div>
      <div style="overflow-x:auto;">
        <table class="wind-table">
          <thead>
            <tr>
              <th>Település</th>
              <th>Lökés irány</th>
              <th>Lökés km/h</th>
              <th>Átlag irány</th>
              <th>Átlag km/h</th>
              <th>Átlag kt</th>
            </tr>
          </thead>
          <tbody id="windBody">
            <tr><td colspan="6" style="text-align:center;color:#64748b;">Nyomd meg a zöld gombot</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <div>
          <label>Pozíció</label>
          <button class="btn-secondary" onclick="getLocation()">GPS lekérése</button>
          <select id="testSelect" onchange="applyTestPosition()" style="margin-top:8px;">
            <option value="">Tesztpont…</option>
            <option value="fured">Balatonfüred előtt</option>
            <option value="szolo_keszthely">Szóló Keszthely</option>
            <option value="szolo_almadi">Szóló Almádi</option>
            <option value="szolo_aliga">Szóló Aliga</option>
          </select>
          <div class="status" id="locStatus">Még nincs pozíció</div>
        </div>
        <div>
          <label>Célpont</label>
          <select id="targetSelect" onchange="onTargetChange()">
            <option value="szolo_rajt">Szóló Rajt</option>
            <option value="szolo_keszthely">Szóló Keszthely</option>
            <option value="szolo_aliga">Szóló Aliga</option>
            <option value="szolo_almadi">Szóló Almádi</option>
            <option value="manual">Manuális</option>
          </select>
          <div id="manualTarget" style="display:none;margin-top:8px;">
            <div class="row">
              <div>
                <label>Szélesség (°)</label>
                <input id="manualLat" inputmode="decimal" placeholder="46.75654">
              </div>
              <div>
                <label>Hosszúság (°)</label>
                <input id="manualLon" inputmode="decimal" placeholder="17.26233">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card">
      <label>Szél-előrejelzés (Open-Meteo) — több modell</label>
      <label class="chk"><input type="checkbox" name="fcModel" value="icon_d2" data-label="ICON-D2" data-color="#3b82f6" checked> <span class="swatch" style="background:#3b82f6"></span>ICON-D2 (~2 km, DWD)</label>
      <label class="chk"><input type="checkbox" name="fcModel" value="icon_eu" data-label="ICON-EU" data-color="#22c55e"> <span class="swatch" style="background:#22c55e"></span>ICON-EU (~7 km)</label>
      <label class="chk"><input type="checkbox" name="fcModel" value="geosphere_seamless" data-label="AROME GeoSphere" data-color="#f59e0b"> <span class="swatch" style="background:#f59e0b"></span>AROME GeoSphere (~2.5 km)</label>
      <label class="chk"><input type="checkbox" name="fcModel" value="gfs_seamless" data-label="GFS" data-color="#a855f7"> <span class="swatch" style="background:#a855f7"></span>GFS</label>
      <label class="chk"><input type="checkbox" id="useNowcast" data-label="met.hu mérés" data-color="#94a3b8" checked> <span class="swatch" style="background:#94a3b8"></span>met.hu mérés (állandó most)</label>
      <button class="btn-success" onclick="loadForecast()">Kijelölt modellek letöltése</button>
      <div class="status" id="fcStatus">Az első 2 órában a met.hu mérés keveredik minden modellel, ha le van töltve.</div>
    </div>
    <div class="card">
      <button class="btn-primary" onclick="planFullRoute()">Isochrone útvonal (összes kijelölt)</button>
      <div id="result" style="display:none;" class="result"></div>
    </div>
    <div class="card">
      <div id="map"></div>
    </div>
  </div>

    function pointInPolygon(lat, lon, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const yi = poly[i][0], xi = poly[i][1];
        const yj = poly[j][0], xj = poly[j][1];
        const intersect = ((yi > lat) !== (yj > lat)) &&
          (lon < (xj - xi) * (lat - yi) / ((yj - yi) || 1e-12) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function onWater(lat, lon) {
      if (pointInPolygon(lat, lon, tihanyLand)) return false;
      if (pointInPolygon(lat, lon, tihanyShallow)) return false;
      return pointInPolygon(lat, lon, balatonPolygon);
    }

    function segmentOnWater(a, b, samples) {
      const n = samples || 10;
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        const lat = a.lat + (b.lat - a.lat) * t;
        const lon = a.lon + (b.lon - a.lon) * t;
        if (!onWater(lat, lon)) return false;
      }
      return true;
    }

    function stationEffective(st) {
      const avgKt = (st.avg_kt != null) ? +st.avg_kt : ((+st.avg_kmh || 0) / 1.852);
      const dir = +st.direction || 0;
      return { dir, spd: avgKt, avgKt, gustKt: avgKt };

    function getInterpolatedWind(lat, lon) {
      let sumW = 0, sumDirX = 0, sumDirY = 0, sumSpd = 0;
      for (const [name, st] of Object.entries(allStations)) {
        const coord = stationCoords[name];
        if (!coord) continue;
        const d = haversineKm(lat, lon, coord.lat, coord.lon);
        const eff = stationEffective(st);
        if (d < 0.15) return { dir: eff.dir, spd: eff.spd };
        const w = 1 / Math.pow(Math.max(d, 0.05), 2);
        const rad = eff.dir * Math.PI / 180;
        sumDirX += Math.cos(rad) * w;
        sumDirY += Math.sin(rad) * w;
        sumSpd += eff.spd * w;
        sumW += w;
      }
      if (sumW === 0) return { dir: 225, spd: 6 };
      const dir = (Math.atan2(sumDirY / sumW, sumDirX / sumW) * 180 / Math.PI + 360) % 360;
      return { dir, spd: sumSpd / sumW };
    }

    function getBoatSpeed(polar, windKt, twa) {
      const winds = polar.winds;
      let w1 = winds[0], w2 = winds[winds.length-1];
      for (let i = 0; i < winds.length-1; i++) {
        if (windKt >= winds[i] && windKt <= winds[i+1]) { w1 = winds[i]; w2 = winds[i+1]; break; }
      }
      if (windKt <= winds[0]) w1 = w2 = winds[0];
      if (windKt >= winds[winds.length-1]) w1 = w2 = winds[winds.length-1];
      const idx1 = winds.indexOf(w1);
      if (twa <= polar.beatAngles[idx1] + 3) {
        const ratio = (w2 === w1) ? 0 : (windKt - w1)/(w2 - w1);
        const vmg = polar.beatVMG[idx1] + ratio * (polar.beatVMG[winds.indexOf(w2)] - polar.beatVMG[idx1]);
        return { speed: vmg / Math.cos(Math.min(twa, 80)*Math.PI/180), vmg };
      }
      const angles = polar.angles;
      let a1 = angles[0], a2 = angles[angles.length-1];
      for (let i = 0; i < angles.length-1; i++) {
        if (twa >= angles[i] && twa <= angles[i+1]) { a1 = angles[i]; a2 = angles[i+1]; break; }
      }
      function sp(w, a) { return polar.speeds[w][angles.indexOf(a)]; }
      const rW = (w2 === w1) ? 0 : (windKt - w1)/(w2 - w1);
      const rA = (a2 === a1) ? 0 : (twa - a1)/(a2 - a1);
      const s = (sp(w1,a1) + rA*(sp(w1,a2)-sp(w1,a1))) + rW*((sp(w2,a1)+rA*(sp(w2,a2)-sp(w2,a1)))-(sp(w1,a1)+rA*(sp(w1,a2)-sp(w1,a1))));
      return { speed: s, vmg: s * Math.cos(twa * Math.PI/180) };
    }

    function beatAngleAt(polar, windKt) {
      const winds = polar.winds, ba = polar.beatAngles;
      if (windKt <= winds[0]) return ba[0];
      if (windKt >= winds[winds.length-1]) return ba[ba.length-1];
      for (let i = 0; i < winds.length-1; i++) {
        if (windKt >= winds[i] && windKt <= winds[i+1]) {
          const r = (windKt - winds[i]) / (winds[i+1] - winds[i]);
          return ba[i] + r * (ba[i+1] - ba[i]);
        }
      }
      return ba[0];
    }

    function polarActions(polar, wind) {
      const acts = [];
      const beat = beatAngleAt(polar, wind.spd);
      acts.push({ twa: beat, heading: (wind.dir + beat) % 360 });
      acts.push({ twa: beat, heading: (wind.dir - beat + 360) % 360 });
      for (let i = 0; i < polar.angles.length; i++) {
        const a = polar.angles[i];
        acts.push({ twa: a, heading: (wind.dir + a) % 360 });
        acts.push({ twa: a, heading: (wind.dir - a + 360) % 360 });
      }
      return acts;
    }

        const data = await res.json();
        const arr = Array.isArray(data) ? data : [data];
        if (arr[0] && arr[0].error) throw new Error(model + ': ' + (arr[0].reason || arr[0].error));
        arr.forEach((d, j) => {
          if (!d.hourly) return;
          points.push({
            lat: g[j].lat, lon: g[j].lon,
            times: d.hourly.time.map(t => Date.parse(t)),
            spd: d.hourly.wind_speed_10m,
            dir: d.hourly.wind_direction_10m,
            gust: d.hourly.wind_gusts_10m || d.hourly.wind_speed_10m
          });
        });
        if (status) status.textContent = model + ': ' + points.length + '/' + grid.length + ' pont...';
      }
      if (!points.length) throw new Error(model + ': üres válasz');
      return { model, fetched: Date.now(), points };
    }

    async function loadForecast() {
      const status = document.getElementById('fcStatus');
      const inputs = selectedModelInputs();
      if (!inputs.length) {
        status.textContent = 'Jelölj ki legalább egy modellt.';
        return;
      }
      const grid = forecastGrid();
      forecasts = {};
      const ok = [], bad = [];
      for (let i = 0; i < inputs.length; i++) {
        const model = inputs[i].value;
        status.textContent = 'Letöltés: ' + (inputs[i].dataset.label || model) + '...';
        try {
          forecasts[model] = await fetchOneModel(model, grid, status);
          ok.push(inputs[i].dataset.label || model);
        } catch (e) {
          bad.push((inputs[i].dataset.label || model) + ' (' + e.message + ')');
        }
      }
      status.textContent = (ok.length ? ('OK: ' + ok.join(', ')) : 'Nincs modell')
        + (bad.length ? ' • hiba: ' + bad.join('; ') : '')
        + ' • ' + new Date().toLocaleTimeString('hu-HU');
    }

    function interpHourly(pt, tms) {
      const times = pt.times;
      if (!times || !times.length) return null;
      if (tms <= times[0]) return { spd: pt.spd[0], dir: pt.dir[0] };
      if (tms >= times[times.length-1]) {
        const i = times.length-1;
        return { spd: pt.spd[i], dir: pt.dir[i] };
      }
      let i = 0;
      while (i < times.length-1 && times[i+1] < tms) i++;
      const r = (tms - times[i]) / (times[i+1] - times[i]);
      const spd = pt.spd[i] + r * (pt.spd[i+1] - pt.spd[i]);
      const a = pt.dir[i] * Math.PI/180, b = pt.dir[i+1] * Math.PI/180;
      const x = (1-r)*Math.cos(a) + r*Math.cos(b);
      const y = (1-r)*Math.sin(a) + r*Math.sin(b);
      const dir = (Math.atan2(y, x)*180/Math.PI + 360) % 360;
      return { spd, dir };
    }

    function getForecastOnly(lat, lon, tms) {
      const forecast = activeForecast;
      if (!forecast || !forecast.points.length) return null;
      let sumW = 0, sx = 0, sy = 0, ss = 0;
      for (let i = 0; i < forecast.points.length; i++) {
        const pt = forecast.points[i];
        const d = haversineKm(lat, lon, pt.lat, pt.lon);
        const w = 1 / Math.pow(Math.max(d, 0.4), 2);
        const h = interpHourly(pt, tms);
        if (!h) continue;
        const rad = h.dir * Math.PI / 180;
        sx += Math.cos(rad) * w;
        sy += Math.sin(rad) * w;
        ss += h.spd * w;
        sumW += w;
      }
      if (sumW === 0) return null;
      return { spd: ss / sumW, dir: (Math.atan2(sy / sumW, sx / sumW) * 180 / Math.PI + 360) % 360 };
    }

    function blendWind(a, b, wA) {
      if (!a) return b;
      if (!b) return a;
      const wB = 1 - wA;
      const ar = a.dir * Math.PI / 180, br = b.dir * Math.PI / 180;
      const x = wA * Math.cos(ar) + wB * Math.cos(br);
      const y = wA * Math.sin(ar) + wB * Math.sin(br);
      return {
        spd: wA * a.spd + wB * b.spd,
        dir: (Math.atan2(y, x) * 180 / Math.PI + 360) % 360
      };
    }

    function getWindAt(lat, lon, tms) {
      const hasObs = Object.keys(allStations).length > 0;
      const obs = hasObs ? getInterpolatedWind(lat, lon) : null;
      const fc = getForecastOnly(lat, lon, tms);
      if (obs && fc) {
        const hours = Math.max(0, (tms - Date.now()) / 3600000);
        const wObs = Math.max(0, 1 - hours / 2);
        return blendWind(obs, fc, wObs);
      }
      if (obs) return obs;
      if (fc) return fc;
      return { dir: 225, spd: 6 };
    }

    function windSourceLabel() {
      const hasObs = Object.keys(allStations).length > 0;
      if (hasObs && activeForecast) return 'met.hu (0–2 óra) → ' + activeForecast.model;
      if (hasObs && !activeForecast) return 'csak met.hu mérés';
      if (activeForecast) return 'csak ' + activeForecast.model;
      return 'nincs széladat';
    }

    function cellKey(lat, lon) {
      const s = inStraitZone(lat, lon);
      const dlat = s ? 0.00085 : 0.0026;
      const dlon = s ? 0.00115 : 0.0036;
      return Math.round(lat / dlat) + ':' + Math.round(lon / dlon);
    }

    function projectAlongCross(p, start, axisDeg) {
      const d = haversineKm(start.lat, start.lon, p.lat, p.lon);
      const brg = calcBearing(start.lat, start.lon, p.lat, p.lon);
      let ang = (brg - axisDeg) * Math.PI / 180;
      while (ang > Math.PI) ang -= 2 * Math.PI;
      while (ang < -Math.PI) ang += 2 * Math.PI;
      return { along: d * Math.cos(ang), cross: d * Math.sin(ang), lat: p.lat, lon: p.lon, t: p.t };
    }

    function drawIsochrones(visited, start, goal, maxT) {
      isoLayers.forEach(l => map.removeLayer(l));
      isoLayers = [];
      const axis = calcBearing(start.lat, start.lon, goal.lat, goal.lon);
      const all = [];
      visited.forEach(p => all.push(projectAlongCross(p, start, axis)));
      const tmax = Math.max(maxT, 1);
      for (let t = 0.5; t <= tmax + 0.01; t += 0.5) {
        const reached = [];
        for (let i = 0; i < all.length; i++) {
          if (all[i].t <= t + 0.04) reached.push(all[i]);
        }
        if (reached.length < 4) continue;
        const binW = 0.32;
        const bins = new Map();
        for (let i = 0; i < reached.length; i++) {
          const p = reached[i];
          const b = Math.round(p.cross / binW);
          const prev = bins.get(b);
          if (!prev || p.along > prev.along) bins.set(b, p);
        }
        const pts = Array.from(bins.entries()).sort((a, b) => a[0] - b[0]).map(e => e[1]);
        if (pts.length < 2) continue;
        const hue = 52 - 52 * (t / tmax);
        const isHour = Math.abs(t - Math.round(t)) < 0.05;
        let ring = [pts[0]];
        const rings = [];
        for (let j = 1; j < pts.length; j++) {
          const d = haversineKm(pts[j - 1].lat, pts[j - 1].lon, pts[j].lat, pts[j].lon);
          if (d > 3.2) { rings.push(ring); ring = []; }
          ring.push(pts[j]);
        }
        rings.push(ring);
        rings.forEach(r => {
          if (r.length < 2) return;
          const line = L.polyline(r.map(p => [p.lat, p.lon]), {
            color: 'hsl(' + hue + ',90%,55%)',
            weight: isHour ? 3.4 : 1.7,
            opacity: isHour ? 0.92 : 0.55
          }).addTo(map);
          if (isHour) line.bindTooltip(Math.round(t) + ' óra', { sticky: true });
          isoLayers.push(line);
        });
      }
    }

    function smoothPath(path) {
      const out = path.slice();
      let guard = 0;
      while (guard++ < 400) {
        let cut = false;
        for (let i = 0; i < out.length - 2; i++) {
          const a = { lat: out[i][0], lon: out[i][1] };
          const c = { lat: out[i+2][0], lon: out[i+2][1] };
          const d = haversineKm(a.lat, a.lon, c.lat, c.lon);
          if (d < 3.8 && segmentOnWater(a, c, 8)) {
            out.splice(i + 1, 1);
            cut = true;
            break;
          }
        }
        if (!cut) break;
      }
      return out;
    }

    function isochroneRoute(start, goal, polar, drawIso) {
      const now = Date.now();
      const dtH = 6 / 60;
      const maxH = 11;
      const maxSteps = Math.round(maxH / dtH);
      const visited = new Map();
      const startNode = { lat: start.lat, lon: start.lon, t: 0, parent: null };
      visited.set(cellKey(start.lat, start.lon), startNode);
      let frontier = [startNode];
      let hit = null;
      const cross = needsTihanyCrossing(start, goal);

      for (let step = 0; step < maxSteps && !hit; step++) {
        const nxt = [];
        for (let i = 0; i < frontier.length; i++) {
          const p = frontier[i];
          const wind = getWindAt(p.lat, p.lon, now + p.t * 3600000);
          const strait = inStraitZone(p.lat, p.lon);
          const dt = strait ? dtH * 0.4 : dtH;
          const acts = polarActions(polar, wind);
          const brgG = calcBearing(p.lat, p.lon, goal.lat, goal.lon);
          acts.push({ twa: angleDiff(brgG, wind.dir), heading: brgG });
          const axis = calcBearing(start.lat, start.lon, goal.lat, goal.lon);
          const spread = [0, 35, -35, 55, -55, 75, -75, 90, -90];
          for (let s = 0; s < spread.length; s++) {
            const hdg = (axis + spread[s] + 360) % 360;
            acts.push({ twa: angleDiff(hdg, wind.dir), heading: hdg });
          }
          if (cross) {
            for (let k = 0; k < TIHANY_CHANNEL.length; k++) {
              const wp = TIHANY_CHANNEL[k];
              if (haversineKm(p.lat, p.lon, wp.lat, wp.lon) < 4) {
                const brg = calcBearing(p.lat, p.lon, wp.lat, wp.lon);
                acts.push({ twa: angleDiff(brg, wind.dir), heading: brg });
              }
            }
          }
          for (let a = 0; a < acts.length; a++) {
            const act = acts[a];
            const speed = Math.max(getBoatSpeed(polar, wind.spd, act.twa).speed, 0.55);
            const vmgG = speed * Math.cos(angleDiff(act.heading, brgG) * Math.PI / 180);
            if (!strait && angleDiff(act.heading, brgG) > 118) continue;
            const next = destinationPoint(p.lat, p.lon, act.heading, speed * dt * 1.852);
            if (!onWater(next.lat, next.lon)) continue;
            if (!segmentOnWater(p, next, strait ? 8 : 4)) continue;
            const t = p.t + dt;
            const k = cellKey(next.lat, next.lon);
            const prev = visited.get(k);
            if (prev && prev.t <= t + 1e-9) continue;
            const q = { lat: next.lat, lon: next.lon, t, parent: p };
            visited.set(k, q);
            nxt.push(q);
            if (haversineNM(q.lat, q.lon, goal.lat, goal.lon) < 0.35) {
              if (!hit || q.t < hit.t) hit = q;
            }
          }
        }
        if (!nxt.length) break;
        frontier = nxt;
      }

      let reached = !!hit;
      if (hit) {
        const lastDt = haversineNM(hit.lat, hit.lon, goal.lat, goal.lon);
        const wind = getWindAt(hit.lat, hit.lon, now + hit.t * 3600000);
        const brg = calcBearing(hit.lat, hit.lon, goal.lat, goal.lon);
        const spd = Math.max(getBoatSpeed(polar, wind.spd, angleDiff(brg, wind.dir)).speed, 0.6);
        hit = { lat: goal.lat, lon: goal.lon, t: hit.t + lastDt / spd, parent: hit };
      } else {
        let best = null, bestD = 1e9;
        visited.forEach(q => {
          const d = haversineNM(q.lat, q.lon, goal.lat, goal.lon);
          if (d < bestD) { bestD = d; best = q; }
        });
        hit = best;
      }

      if (drawIso) drawIsochrones(visited, start, goal, hit ? hit.t : 8);

      const raw = [];
      let p = hit, guard = 0;
      while (p && guard++ < 500) {
        raw.push([p.lat, p.lon]);
        p = p.parent;
      }
      raw.reverse();
      if (reached && (raw.length === 0 || haversineNM(raw[raw.length-1][0], raw[raw.length-1][1], goal.lat, goal.lon) > 0.05)) {
        raw.push([goal.lat, goal.lon]);
      }
      const path = smoothPath(raw);
      let totalNM = 0;
      for (let i = 1; i < path.length; i++) {
        totalNM += haversineNM(path[i-1][0], path[i-1][1], path[i][0], path[i][1]);
      }
      return {
        path, totalNM, totalTime: hit ? hit.t : 0, ok: reached,
        nodes: visited.size, isos: Math.max(1, Math.round((hit ? hit.t : 0) * 2))
      };
    }

    async function planFullRoute() {
      if (!currentPos) { alert("Előbb állíts be pozíciót!"); return; }
      const hasObs = Object.keys(allStations).length > 0;
      const useNow = document.getElementById('useNowcast') && document.getElementById('useNowcast').checked;
      const modelJobs = selectedModelInputs()
        .filter(inp => forecasts[inp.value])
        .map(inp => ({
          id: inp.value,
          label: inp.dataset.label || inp.value,
          color: inp.dataset.color || '#3b82f6',
          fc: forecasts[inp.value]
        }));
      const jobs = [];
      if (useNow) {
        if (!hasObs) { alert("A met.hu méréshez előbb töltsd le a zöld gombbal a szelet."); return; }
        jobs.push({ id: 'nowcast', label: 'met.hu mérés', color: '#94a3b8', fc: null });
      }
      for (let i = 0; i < modelJobs.length; i++) jobs.push(modelJobs[i]);
      if (!jobs.length) {
        alert("Jelölj ki met.hu mérést, vagy töltsd le a kijelölt modelleket.");
        return;
      }
      const polar = polars[document.getElementById('boat').value];
      const target = getTarget();
      if (!target) return;
      routeLines.forEach(l => map.removeLayer(l));
      routeLines = [];
      isoLayers.forEach(l => map.removeLayer(l));
      isoLayers = [];
      if (targetMarker) map.removeLayer(targetMarker);

      const status = document.getElementById('result');
      status.style.display = 'block';
      const rows = [];
      const one = jobs.length === 1;

      for (let i = 0; i < jobs.length; i++) {
        const job = jobs[i];
        status.innerHTML = job.label + ' számolása (' + (i+1) + '/' + jobs.length + ')...';
        await new Promise(r => setTimeout(r, 40));
        activeForecast = job.fc;
        const t0 = performance.now();
        const res = isochroneRoute(currentPos, target, polar, one);
        const ms = Math.round(performance.now() - t0);
        const line = L.polyline(res.path, { color: job.color, weight: one ? 5 : 4, opacity: 0.92 }).addTo(map);
        line.bindTooltip(job.label, { sticky: true });
        routeLines.push(line);
        const h = Math.floor(res.totalTime);
        const m = Math.round((res.totalTime - h) * 60);
        rows.push({
          label: job.label,
          color: job.color,
          nm: res.totalNM,
          t: res.totalTime,
          eta: h + ' ó ' + m + ' p',
          ok: res.ok,
          ms
        });
      }

      targetMarker = L.marker([target.lat, target.lon]).addTo(map)
        .bindPopup(`<b>${target.name}</b>`).openPopup();
      const allPts = [];
      routeLines.forEach(l => l.getLatLngs().forEach(p => allPts.push(p)));
      if (allPts.length) map.fitBounds(allPts, { padding: [40, 40] });

      rows.sort((a, b) => a.t - b.t);
      const best = rows[0];
      status.innerHTML = `
        <strong>${target.name}</strong> • ${jobs.length} útvonal<br>
        <table class="wind-table">
          <thead><tr><th>Modell</th><th>ETA</th><th>Táv</th><th>Cél</th></tr></thead>
          <tbody>
            ${rows.map(r => `<tr>
              <td><span class="swatch" style="background:${r.color}"></span>${r.label}${r === best ? ' <b>leggyorsabb</b>' : ''}</td>
              <td>${r.eta}</td>
              <td>${r.nm.toFixed(1)} NM</td>
              <td>${r.ok ? 'igen' : 'nem ért be'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
        <span style="font-size:0.8rem;opacity:0.85;">
          ${one ? 'Isochrone görbék az egyetlen modellhez. ' : 'Több modell: csak az útvonalak (görbék ki). '}
          met.hu keverés 0–2 óra, ha a mérés be van töltve.
        </span>
      `;
    }

    function haversineNM(lat1, lon1, lat2, lon2) {
      return haversineKm(lat1, lon1, lat2, lon2) / 1.852;
    }
    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function calcBearing(lat1, lon1, lat2, lon2) {
      const φ1 = lat1*Math.PI/180, φ2 = lat2*Math.PI/180, Δλ = (lon2-lon1)*Math.PI/180;
      const y = Math.sin(Δλ)*Math.cos(φ2);
      const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
      return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
    }
    function angleDiff(a, b) {
      let d = Math.abs(a - b) % 360;
      return d > 180 ? 360 - d : d;
    }
    function destinationPoint(lat, lon, bearing, distKm) {
      const R = 6371, δ = distKm/R, θ = bearing*Math.PI/180;
      const φ1 = lat*Math.PI/180, λ1 = lon*Math.PI/180;
      const φ2 = Math.asin(Math.sin(φ1)*Math.cos(δ) + Math.cos(φ1)*Math.sin(δ)*Math.cos(θ));
      const λ2 = λ1 + Math.atan2(Math.sin(θ)*Math.sin(δ)*Math.cos(φ1), Math.cos(δ)-Math.sin(φ1)*Math.sin(φ2));
      return { lat: φ2*180/Math.PI, lon: ((λ2*180/Math.PI)+540)%360-180 };
    }

    initMap();
  </script>
